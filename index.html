<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sawyer Nicastro</title>

    <!-- fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans+Code:ital,wght@0,300..800;1,300..800&display=swap"
        rel="stylesheet">
    <!-- scripts -->
    <link rel="stylesheet" href="style.css">
    <script src="index.js"></script>
</head>

<body>
    <canvas style="width:100%; height:100%; position:fixed;"></canvas>
    <div id="header" style="display:flex; width:98vw; overflow:hidden; gap:10px; align-items:center;">
        <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>

        <model-viewer id="logo"
            src="https://rawcdn.githack.com/SawyerNic/portfolio/8fbf7ef97218312f4ee4851be6b908dcc27df6af/models/sawyers-head.glb"
            alt="3D Logo"
            style="margin-top:10px; margin-left:30px; margin-right:30px; width:100px; min-width:100px; background:transparent;"
            auto-rotate rotation-per-second="60deg" disable-zoom></model-viewer>
        <div>
            <h1 class="google-sans-code" id="typewriter" style="white-space: nowrap;"><span
                    id="typewriter-text"></span><span id="typewriter-cursor">|</span></h1>
            <h3 class="google-sans-code">// I am a software developer</h3>
        </div>


        <nav
            style="display:flex; align-items:center; gap:1em; margin-left:auto; margin-right:20px; background-color:#f4f4f4; border-radius:15px; padding:30px; box-shadow: 4px 4px grey;">
            <button type="button" class="buttonOne blue">Blog</button>
            <button type="button" class="buttonOne orange">Projects</button>
            <button type="button" class="buttonOne green">Skills</button>
            <button type="button" class="buttonOne yellow">Workflows</button>
            <button type="button" class="buttonOne purple">Contact</button>
        </nav>
    </div>

    <!-- Login Modal -->
    <div id="loginModal"
        style="display:none; position:fixed; top:0; left:0; width:100vw; height:100vh; background:rgba(0,0,0,0.5); align-items:center; justify-content:center;">
        <div style="background:#fff; padding:2em; border-radius:8px; min-width:300px; position:relative;">
            <span id="closeModal" style="position:absolute; top:8px; right:12px; cursor:pointer;">&times;</span>
            <h2>Admin Login</h2>
            <input id="adminUser" type="text" placeholder="Username" style="width:100%;margin-bottom:1em;">
            <input id="adminPass" type="password" placeholder="Password" style="width:100%;margin-bottom:1em;">
            <button onclick="login()">Login</button>
            <div id="loginError" style="color:red; margin-top:1em; display:none;">Invalid credentials</div>
        </div>
    </div>



    <pre id="dbContents"
        style="background:#f4f4f4; max-width:100vw; white-space:pre-wrap; padding:1em; border-radius:8px; margin:2em 0;"></pre>


    <style>
        #typewriter-cursor {
            display: inline-block;
            width: 1ch;
            animation: blink 1s steps(1) infinite;
        }

        @keyframes blink {

            0%,
            50% {
                opacity: 1;
            }

            51%,
            100% {
                opacity: 0;
            }
        }
    </style>
    <script>
        // Typing animation for the h1 with blinking cursor
        document.addEventListener('DOMContentLoaded', function () {
            let text = 'console.log("Hi, I\'m Sawyer");';
            const el = document.getElementById('typewriter-text');
            let i = 0;
            function type() {
                if (i <= text.length) {
                    el.textContent = text.slice(0, i);
                    i++;
                    setTimeout(type, 40);
                }
            }
            type();

            const labelList = [
                'Software Developer',
                'Full Stack Engineer',
                'Front End Developer',
                'Back End Developer',
                'UX Engineer'
            ]

            i = 0;
            function typeLoop() {
                
            }
        });
    </script>
</body>

</html>
