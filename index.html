<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sawyer Nicastro</title>

    <!-- fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans+Code:ital,wght@0,300..800;1,300..800&display=swap"
        rel="stylesheet">
    <!-- scripts -->
    <script src="https://kit.fontawesome.com/eee0905714.js" crossorigin="anonymous"></script>
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link rel="stylesheet" href="style.css">
    <script src="canvas.js"></script>
    <script src="index.js"></script>
    <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>

</head>

<body>
    <canvas id="myCanvas"></canvas>
    <div id="header">

        <div class="logo-container">
            <model-viewer id="logo"
                src="https://rawcdn.githack.com/SawyerNic/portfolio/8fbf7ef97218312f4ee4851be6b908dcc27df6af/models/sawyers-head.glb"
                alt="3D Logo" auto-rotate rotation-per-second="60deg" disable-zoom></model-viewer>

        </div>

        <div>
            <h1 class="google-sans-code" id="typewriter" style="white-space: nowrap;"><span
                    id="typewriter-text"></span><span id="top-typewriter-cursor">|</span></h1>
            <h2 class="google-sans-code" style="white-space: nowrap;"><span id="label-text"></span><span
                    id="looping-labels"></span><span id="bottom-typewriter-cursor" style="display:none;">|</span></h2>
        </div>

        <nav class="main-nav">
            <span id="icons">
                <a id="linkedin"><i class="fa-brands fa-square-linkedin"></i></a>
                <a id="github"><i class="fa-brands fa-github"></i></a>
                <a id="gmail"><i class="fa-solid fa-envelope"></i></a>
                <a id="resume"><i class="fa-solid fa-file-arrow-down"></i></a>
            </span>
        </nav>
    </div>

    <div id="margin">

        <!-- about section -->
        <div id="About" class="glass">
            <h1 class="google-sans-code">About Me</h1>
            <div class="lists">
                <div class="list">
                    <h2>Current Focuses</h2>
                    <ul id="currentFocus">

                    </ul>
                </div>
                <div class="list">
                    <h2>Personal Interests</h2>
                    <ul id="personalInterests">
                    </ul>
                </div>
            </div>
        </div>
        <!-- end about section -->

        <!-- project section -->
        <div id="projects" class="glass">
            <h1 id="ph" class="google-sans-code">Projects</h1>
        </div>
    </div>
    <!-- end project section -->

    </div>

    <!-- Login Modal -->
    <div id="loginModal"
        style="display:none; position:fixed; top:0; left:0; width:100vw; height:100vh; background:rgba(0,0,0,0.5); align-items:center; justify-content:center;">
        <div style="background:#fff; padding:2em; border-radius:8px; min-width:300px; position:relative;">
            <span id="closeModal" style="position:absolute; top:8px; right:12px; cursor:pointer;">&times;</span>
            <h2>Admin Login</h2>
            <input id="adminUser" type="text" placeholder="Username" style="width:100%;margin-bottom:1em;">
            <input id="adminPass" type="password" placeholder="Password" style="width:100%;margin-bottom:1em;">
            <button onclick="login()">Login</button>
            <div id="loginError" style="color:red; margin-top:1em; display:none;">Invalid credentials</div>
        </div>
    </div>




    <style>
        #typewriter-cursor {
            display: inline-block;
            width: 1ch;
            animation: blink 1s steps(1) infinite;
        }

        @keyframes blink {

            0%,
            50% {
                opacity: 1;
            }

            51%,
            100% {
                opacity: 0;
            }
        }
    </style>
    <script>
        // Typing animation for the h1 with blinking cursor
        document.addEventListener('DOMContentLoaded', function () {


            const topCursor = document.getElementById('top-typewriter-cursor');
            const bottomCursor = document.getElementById('bottom-typewriter-cursor');


            const text = 'Hi, I\'m Sawyer';
            const el = document.getElementById('typewriter-text');
            let i = 0;
            function type(done) {
                if (i <= text.length) {
                    el.textContent = text.slice(0, i);
                    i++;
                    setTimeout(() => type(done), 50);
                } else if (done) {
                    topCursor.style.display = "none";
                    bottomCursor.style.display = "inline";
                    done();
                }
            }

            const labelText = "I am a ";
            const elTwo = document.getElementById('label-text');

            function typeLoop(done) {
                let j = 0;
                function loop() {
                    if (j <= labelText.length) {
                        elTwo.textContent = labelText.slice(0, j);
                        j++;
                        setTimeout(loop, 50);
                    } else {
                        done();
                    }
                }
                loop();
            }

            const loopElement = document.getElementById('looping-labels');

            const labelList = [
                'Software Developer',
                'Full Stack Engineer',
                'UX Engineer',
            ];

            function animateLabel(arrIndex = 0, stringIndex = 0, forward = true) {
                let tempString = labelList[arrIndex];
                if (forward) {
                    if (stringIndex <= tempString.length) {
                        loopElement.textContent = tempString.slice(0, stringIndex);
                        setTimeout(() => animateLabel(arrIndex, stringIndex + 1, true), 50);
                    } else {
                        setTimeout(() => animateLabel(arrIndex, stringIndex - 1, false), 800); // pause before deleting
                    }
                } else {
                    if (stringIndex >= 0) {
                        loopElement.textContent = tempString.slice(0, stringIndex);
                        setTimeout(() => animateLabel(arrIndex, stringIndex - 1, false), 40);
                    } else {
                        setTimeout(() => animateLabel((arrIndex + 1) % labelList.length, 0, true), 40); // pause before next word
                    }
                }
            }

            type(function () {
                typeLoop(function () {
                    animateLabel();
                });
            });
        });

    </script>

    <template id="project-template">
        <div class="project">
            <video autoplay loop muted playsinline>
                <source class="video" type="video/webm">
            </video>
            <h3 class="project-title"></h3>
            <p class="project-description"></p>
            <div id="logos"></div>
            <a class="source-code"><i class="fa-brands fa-github-alt"></i></a>
            <a class="live-site"><i class="fa-solid fa-globe"></i></a>
        </div>
    </template>
</body>
